services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: battle
      POSTGRES_PASSWORD: battle
      POSTGRES_DB: battle_royale
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battle -d battle_royale"]
      interval: 2s
      timeout: 2s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://battle:battle@db:5432/battle_royale"
      SECRET_KEY: "dev-local-testing"
      CORS_ORIGINS: '["http://localhost:3000","https://frontend-gamma-brown-61.vercel.app","https://openfield-ai.vercel.app","https://openfield.vercel.app"]'
      DEV_MODE: "true"
    depends_on:
      db:
        condition: service_healthy
