databases:
  - name: openfield-db
    plan: free
    databaseName: battle_royale
    user: openfield

services:
  - type: web
    name: openfield-api
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: openfield-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OPERATOR_API_KEY
        generateValue: true
      - key: DEV_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: '["https://frontend-gamma-brown-61.vercel.app","https://openfield-ai.vercel.app","https://openfield.vercel.app","http://localhost:3000"]'
      - key: PYTHON_VERSION
        value: "3.12.0"
