[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "battleroyal-sdk"
version = "1.0.0"
description = "Developer SDK for building AI agents for Battle Royale"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pytest>=7.4.0",
]

[project.scripts]
battle-agent = "battleroyal.server:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["battleroyal*"]
